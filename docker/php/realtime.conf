# WebSocket da Mesa de teste compartilhada: /realtime/ vai para o serviço Node.js da pasta realtime/.
# REALTIME_UPSTREAM é host:porta do serviço — realtime:8090 no docker-compose de desenvolvimento e
# 127.0.0.1:8090 em produção (rede do host). O cloudflared também pode mandar /realtime/ direto para lá.
<IfModule mod_proxy_http.c>
    ProxyPass "/realtime/" "http://${REALTIME_UPSTREAM}/realtime/" upgrade=websocket disablereuse=On
</IfModule>
